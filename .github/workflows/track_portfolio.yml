name: Track Portfolio Intraday

on:
  schedule:
    - cron: '5,20,35,50 13-20 * * 1-5'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Pull latest changes (including database)
        run: |
          git fetch origin main
          git reset --hard origin/main
      
      - name: Track portfolio
        run: |
          python << 'EOF'
          from dashboard_metrics import init_tracking, track_intraday
          from dashboard import load_equity, START_CAPITAL_DKK
          import pandas as pd
          
          init_tracking()
          equity = load_equity('data/papertrade/portfolio_value_daily.csv')
          current_value = float(equity.iloc[-1])
          daily_return = ((current_value / START_CAPITAL_DKK) - 1) * 100
          track_intraday(current_value, daily_return)
          print(f'Tracked: {current_value:,.0f} kr')
          EOF
      
      - name: Verify database
        run: |
          python << 'EOF'
          import sqlite3
          conn = sqlite3.connect('data/portfolio_metrics.db')
          cursor = conn.cursor()
          cursor.execute("SELECT COUNT(*) FROM intraday_values")
          count = cursor.fetchone()[0]
          cursor.execute("SELECT MAX(timestamp) FROM intraday_values")
          latest = cursor.fetchone()[0]
          print(f'Total intraday records: {count}')
          print(f'Latest timestamp: {latest}')
          conn.close()
          EOF
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/portfolio_metrics.db
          git diff --cached --exit-code || git commit -m "Track intraday portfolio value at $(date -u +'%H:%M UTC')"
          git push origin main
        continue-on-error: true
