name: Run papertrade test

on:
  schedule:
    - cron: '0,15,30,45 13-20 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [papertrade-trigger]

jobs:
  papertrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run papertrade
        run: python papertrade.py
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/weights_latest.csv data/papertrade/
          git diff --cached --exit-code || git commit -m "Update portfolio weights and values at $(date -u +'%H:%M UTC')"
          git push origin main
        continue-on-error: true
