name: Run papertrade test

on:
  workflow_dispatch:
  schedule:
    # Runs every 15 minutes at :00, :15, :30, :45 from 1:00 PM UTC to 9:00 PM UTC
    # This covers 8:00 AM EST to 4:00 PM EST (1.5 hrs before market open to market close)
    # Market opens at 9:30 AM EST = 2:30 PM UTC (14:30)
    # Market closes at 4:00 PM EST = 9:00 PM UTC (21:00)
    - cron: '0,15,30,45 13-21 * * 1-5'

permissions:
  contents: write
  
jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy yfinance scipy

      - name: Run papertrade
        run: python runner.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/papertrade data/weights_latest.csv
          git commit -m "Update test results" || echo "No changes"
          git push
